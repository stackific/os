# Stackific OS: swap in compressed RAM (zram-generator drop-in, task 026), as large as the RAM, ahead of any swap on
# disk. Only memory that compresses well lands there, so it rarely fills. The kernel's own default compression: Arch
# Linux ARM's kernel has only LZO for zram, so naming zstd would leave it without swap.
[zram0]
zram-size = ram
swap-priority = 100
