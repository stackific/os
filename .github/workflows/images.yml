# Builds and boot-tests the images on the self-hosted runners (just runner setup), the x86_64 ones on the PC and the
# aarch64 ones on the Mac, on every push to main (a merged pull request; operator 2026-11-08) and by hand, never on
# pull_request, so code from a fork never runs on them. A push builds only the images whose files it changed; a run by
# hand has no earlier commit to compare, so it builds all four (just release changed). When a pull request merged the
# commit, the images are also published as the test release v0.0.0-pr.<n> (a prerelease, replaced on a rerun). Every
# step after the setup calls a just recipe.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build still running for the same branch
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}

jobs:
  test-release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pr.outputs.version }}
      any: ${{ steps.changed.outputs.any }}
      arch_x86_64: ${{ steps.changed.outputs.arch_x86_64 }}
      arch_aarch64: ${{ steps.changed.outputs.arch_aarch64 }}
      fedora_x86_64: ${{ steps.changed.outputs.fedora_x86_64 }}
      fedora_aarch64: ${{ steps.changed.outputs.fedora_aarch64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - id: changed
        run: just release changed "$BEFORE" "$GITHUB_SHA" >>"$GITHUB_OUTPUT"
        env:
          BEFORE: ${{ github.event.before }}
      - id: pr
        run: echo "version=$(just release pr-version "$GITHUB_SHA")" >>"$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.pr.outputs.version != '' && steps.changed.outputs.any == 'true'
        run: just release create "$VERSION" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pr.outputs.version }}

  arch-x86_64:
    needs: test-release
    if: needs.test-release.outputs.arch_x86_64 == 'true'
    # The operator's Linux PC
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.test-release.outputs.version || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - run: just arch iso "$VERSION"
      - run: just arch test "$VERSION"
      - run: just arch test-install "$VERSION"
      - if: needs.test-release.outputs.version != ''
        run: just release upload "$VERSION" arch x86_64
        env:
          GH_TOKEN: ${{ github.token }}

  fedora-x86_64:
    needs: test-release
    if: needs.test-release.outputs.fedora_x86_64 == 'true'
    # The operator's Linux PC
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.test-release.outputs.version || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - run: just fedora iso "$VERSION"
      - run: just fedora test "$VERSION"
      - run: just fedora test-install "$VERSION"
      - if: needs.test-release.outputs.version != ''
        run: just release upload "$VERSION" fedora x86_64
        env:
          GH_TOKEN: ${{ github.token }}

  arch-aarch64:
    needs: test-release
    if: needs.test-release.outputs.arch_aarch64 == 'true'
    # The arm64 Linux VM on the operator's Mac (just runner setup there); the host's architecture picks the image
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.test-release.outputs.version || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - run: just arch iso "$VERSION"
      - run: just arch test "$VERSION"
      - if: needs.test-release.outputs.version != ''
        run: just release upload "$VERSION" arch aarch64
        env:
          GH_TOKEN: ${{ github.token }}

  fedora-aarch64:
    needs: test-release
    if: needs.test-release.outputs.fedora_aarch64 == 'true'
    # The arm64 Linux VM on the operator's Mac (just runner setup there); the host's architecture picks the image
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.test-release.outputs.version || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - run: just fedora iso "$VERSION"
      - run: just fedora test "$VERSION"
      - if: needs.test-release.outputs.version != ''
        run: just release upload "$VERSION" fedora aarch64
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [test-release, arch-x86_64, fedora-x86_64, arch-aarch64, fedora-aarch64]
    # Skipped image jobs (nothing of theirs changed) do not hold the test release back; a failed or cancelled one does
    if: ${{ !cancelled() && !failure() && needs.test-release.outputs.version != '' && needs.test-release.outputs.any == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - run: just release publish "$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test-release.outputs.version }}
