# Lighter MangoWM effects where older NVIDIA graphics on the nouveau driver draw the desktop. stackific-gpu-generator links
# /run/stackific/mango-gpu.conf here; each user's config.conf includes that with source_optional, and its own later lines win.
blur=0
blur_layer=0
shadows=0
layer_shadows=0
animation_duration_open=150
animation_duration_close=150
animation_duration_move=150
animation_duration_tag=150
