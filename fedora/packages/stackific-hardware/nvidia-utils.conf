# NVIDIA's open modules drive NVIDIA graphics, as Arch's nvidia-utils sets it up: nouveau and nova blacklisted, and
# nvidia_drm and nvidia_uvm loaded with nvidia. stackific-gpu-generator shadows this file in /run/modprobe.d where
# nouveau must drive the card instead.
blacklist nouveau
blacklist nova_core
blacklist nova_drm
softdep nvidia post: nvidia-uvm nvidia-drm
