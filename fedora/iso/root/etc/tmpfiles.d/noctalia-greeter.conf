# noctalia-greeter's state directory, owned by Fedora's greeter user `greetd` so the greeter can write its sync.toml
# there. Terra's package ships no tmpfiles file; without this line, stackific-greeter.conf's `L` line would create the
# directory owned by root. tmpfiles handles a directory before the paths inside it, so this runs before that link.
d /var/lib/noctalia-greeter 0750 greetd greetd -
