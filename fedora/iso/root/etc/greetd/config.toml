# greetd on the live image only: the first session after boot logs the user `live` into MangoWM with no prompt.
# After a logout, noctalia-greeter is the login screen, where GNOME is the other session (empty password for `live`).
# Fedora's greeter user is `greetd`. See greetd(5).
[terminal]
vt = 1

[initial_session]
command = "mango"
user = "live"

[default_session]
command = "/usr/bin/noctalia-greeter-session"
user = "greetd"
