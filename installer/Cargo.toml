[package]
name = "stackific-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Installs Stackific OS into a drive's free space or onto a whole drive"
license = "Apache-2.0"
publish = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
zxcvbn = "3.1.1"
