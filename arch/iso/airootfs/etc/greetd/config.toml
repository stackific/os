# greetd on the live image only: the first session after boot logs the user `live` into MangoWM with no prompt.
# After a logout, noctalia-greeter is the login screen, where Plasma is the other session (empty password for `live`).
# Logins use stackific-desktop's PAM service, greetd's lines plus oo7's, which unlocks the keyring. See greetd(5).
[general]
service = "stackific-greetd"

[terminal]
vt = 1

[initial_session]
command = "mango"
user = "live"

[default_session]
command = "/usr/bin/noctalia-greeter-session"
user = "greeter"
